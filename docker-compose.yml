version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: loan-postgres
    environment:
      POSTGRES_DB: loan_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: loan-management-system
    ports:
      - "9095:9095"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/loan_management_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres